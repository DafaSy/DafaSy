name: Update Profile README

on:
  schedule:
    # Setiap Senin sekitar pukul 08.17 WIB
    - cron: "17 1 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update README
        env:
          TZ: Asia/Jakarta
        run: |
          UPDATED_TIME=$(date "+%d %B %Y, %H:%M WIB")
          export UPDATED_TIME

          python - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("README.md")
          content = path.read_text(encoding="utf-8")

          replacement = (
              "<!-- LAST-UPDATED:START -->\n"
              f"Last automatically refreshed: {os.environ['UPDATED_TIME']}\n"
              "<!-- LAST-UPDATED:END -->"
          )

          pattern = (
              r"<!-- LAST-UPDATED:START -->.*?"
              r"<!-- LAST-UPDATED:END -->"
          )

          updated = re.sub(pattern, replacement, content, flags=re.DOTALL)
          path.write_text(updated, encoding="utf-8")
          PY

      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "docs: refresh profile status"
          git push
